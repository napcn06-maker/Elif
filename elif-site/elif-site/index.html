<!doctype html><html lang='tr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Elif'e 💗</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#160b12;color:white;overflow:hidden}.bg{position:fixed;inset:-35vh 0 0;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;animation:fall 30s linear infinite}.col{display:flex;flex-direction:column;gap:10px}.col:nth-child(2){transform:translateY(-35vh)}img{width:100%;height:42vh;object-fit:cover;border-radius:18px;filter:brightness(.58)}@keyframes fall{from{transform:translateY(-38vh)}to{transform:translateY(0)}}.shade{position:fixed;inset:0;background:linear-gradient(#13091255,#130912aa)}.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,420px);padding:28px 22px;border-radius:28px;text-align:center;background:#ffffff20;border:1px solid #ffffff55;backdrop-filter:blur(13px);box-shadow:0 20px 60px #0008}.heart{font-size:42px;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.18)}}h1{font-size:28px;margin:8px 0 14px}.text{line-height:1.6;font-size:16px}.question{font-size:25px;font-weight:800;margin:20px 0}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:999px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer}.yes{background:#ff4f87;color:white}.think{background:#fff;color:#64233b}.result{display:none;font-size:21px;font-weight:700;line-height:1.5}.confetti{position:fixed;top:-30px;font-size:24px;animation:drop 3s linear forwards}@keyframes drop{to{transform:translateY(110vh) rotate(500deg);opacity:.1}}@media(min-width:800px){.bg{grid-template-columns:repeat(4,1fr)}img{height:55vh}}
</style></head><body><div class='bg'><div class='col'><img src='1000005224.jpg'><img src='1000005222.jpg'><img src='1000005220.jpg'></div><div class='col'><img src='1000005223.jpg'><img src='1000005219.jpg'><img src='1000005217.jpg'></div><div class='col'><img src='1000005221.jpg'><img src='1000005218.jpg'><img src='1000005224.jpg'></div><div class='col'><img src='1000005222.jpg'><img src='1000005223.jpg'><img src='1000005219.jpg'></div></div><div class='shade'></div><main class='card'><div id='ask'><div class='heart'>💗</div><h1>Elif, sana bir şey söylemek istiyorum…</h1><div class='text'>Bunu normal bir mesajla yazmak istemedim.<br>Biraz daha özel olsun diye böyle bir şey yaptım 😅<br><br>Seninle konuşmak ve vakit geçirmek gerçekten hoşuma gidiyor. Bir süredir de sana sormak istediğim bir şey var…</div><div class='question'>Elif, benimle çıkar mısın? ❤️</div><div class='buttons'><button class='yes' onclick='yes()'>Evet 😊</button><button class='think' onclick='think()'>Biraz düşüneyim 🙈</button></div></div><div id='result' class='result'></div></main><script>
function show(t){document.getElementById('ask').style.display='none';let r=document.getElementById('result');r.style.display='block';r.innerHTML=t}function yes(){show('Yaa 🥹💗<br><br>Bunu gördüğüme çok sevindim.<br>O zaman gerisini beraber konuşalım 😊');for(let i=0;i<35;i++){let e=document.createElement('div');e.className='confetti';e.textContent=['💗','💕','✨','🌸'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(e)}}function think(){show('Tabii ki 😊<br><br>Acele etme, istediğin kadar düşünebilirsin. 💗')}
</script></body></html>
